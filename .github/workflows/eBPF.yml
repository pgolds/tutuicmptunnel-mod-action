name: Build tutuicmptunnel (eBPF Multi-Version)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      distro:
        description: '固件发行版 (OpenWrt / ImmortalWrt)'
        required: true
        type: choice
        default: 'immortalwrt'
        options:
          - immortalwrt
          - openwrt
      version:
        description: '固件版本号 (如: 25.12.0, 24.10.1, 24.10.0 或 SNAPSHOT)'
        required: true
        type: string
        default: '25.12.0'
      target:
        description: '目标架构 (选 custom 时读取下方自定义架构)'
        required: true
        type: choice
        default: 'qualcommax/ipq807x'
        options:
          - qualcommax/ipq807x
          - qualcommax/ipq60xx
          - mediatek/filogic
          - mediatek/mt7622
          - rockchip/armv8
          - x86/64
          - ramips/mt7621
          - custom
      custom_target:
        description: '自定义 Target/Subtarget (仅当上方选 custom 时生效，如 bcm27xx/bcm2711)'
        required: false
        type: string
        default: ''
      src_ref:
        description: 'tutuicmptunnel 源码分支或 Tag (留空拉取默认分支)'
        required: false
        type: string
        default: ''
      enable_xdp:
        description: '开启 XDP Ingress 极致性能模式 (tcpdump 将只能看到还原后的 UDP)'
        required: false
        type: boolean
        default: false
      upload_release:
        description: '自动上传到 GitHub Release'
        required: false
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve build parameters & SDK URL
        id: meta
        run: |
          DISTRO="${{ github.event.inputs.distro }}"
          VERSION="${{ github.event.inputs.version }}"
          TARGET="${{ github.event.inputs.target }}"

          [ -z "$DISTRO" ] && DISTRO="immortalwrt"
          [ -z "$VERSION" ] && VERSION="25.12.0"
          [ -z "$TARGET" ] && TARGET="qualcommax/ipq807x"

          if [ "$TARGET" = "custom" ]; then
            TARGET="${{ github.event.inputs.custom_target }}"
          fi

          case "$TARGET" in
            */*) ;;
            *)
              echo "❌ 错误: Target 格式必须为 <target>/<subtarget>，例如 x86/64 或 bcm27xx/bcm2711"
              exit 1
              ;;
          esac

          if [ "$DISTRO" = "immortalwrt" ]; then
            BASE_HOST="https://downloads.immortalwrt.org"
          else
            BASE_HOST="https://downloads.openwrt.org"
          fi

          if [ "$VERSION" = "SNAPSHOT" ] \vert{}\vert{} [ "$VERSION" = "snapshot" ]; then
            SDK_BASE_URL="${BASE_HOST}/snapshots/targets/${TARGET}/"
            VER_TAG="snapshot"
          else
            SDK_BASE_URL="${BASE_HOST}/releases/${VERSION}/targets/${TARGET}/"
            VER_TAG="${VERSION}"
          fi

          echo "正在查询 SDK 目录: ${SDK_BASE_URL}"
          SDK_FILE=$(curl -fsSLg "$SDK_BASE_URL" | sed -n "s/.*href=\"\(${DISTRO}-sdk-[^\"]*Linux-x86_64\.tar\.[xzst]*\)\".*/\1/p" | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "❌ 未能在 ${SDK_BASE_URL} 找到匹配的 SDK 文件，请核对版本号与架构拼写！"
            exit 1
          fi

          SAFE_TARGET=$(echo "$TARGET" | tr '/' '-')
          RELEASE_TAG="${DISTRO}-${VER_TAG}-${SAFE_TARGET}-tutuicmptunnel-bpf"

          echo "sdk_url=${SDK_BASE_URL}${SDK_FILE}" >> $GITHUB_OUTPUT
          echo "sdk_file=${SDK_FILE}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          echo "✅ 匹配到 SDK: ${SDK_FILE}"
          echo "✅ Release Tag: ${RELEASE_TAG}"

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) \
            zstd clang llvm libelf-dev pkg-config > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Download and extract SDK
        working-directory: /workdir
        run: |
          df -hT $PWD
          wget -q "${{ steps.meta.outputs.sdk_url }}" -O "${{ steps.meta.outputs.sdk_file }}"

          case "${{ steps.meta.outputs.sdk_file }}" in
            *.tar.zst)
              tar --zstd -xf "${{ steps.meta.outputs.sdk_file }}"
              ;;
            *)
              tar -xf "${{ steps.meta.outputs.sdk_file }}"
              ;;
          esac

          rm -f "${{ steps.meta.outputs.sdk_file }}"
          for d in */; do
            mv "$d" openwrt
            break
          done

      - name: Prepare tutuicmptunnel (BPF) OpenWrt Package
        run: |
          cd /workdir/openwrt

          SRC_REF="${{ github.event.inputs.src_ref }}"
          if [ -n "$SRC_REF" ]; then
            git clone --recursive --depth 1 -b "$SRC_REF" https://github.com/hrimfaxi/tutuicmptunnel.git /workdir/tutu-src
          else
            git clone --recursive --depth 1 https://github.com/hrimfaxi/tutuicmptunnel.git /workdir/tutu-src
          fi

          mkdir -p dl package/tutuicmptunnel-bpf
          tar -czf dl/tutuicmptunnel-bpf-src.tar.gz -C /workdir tutu-src

          XDP_FLAG="0"
          if [ "${{ github.event.inputs.enable_xdp }}" = "true" ]; then
            XDP_FLAG="1"
          fi

          cat << 'EOF' > package/tutuicmptunnel-bpf/Makefile
          include $(TOPDIR)/rules.mk
          include $(INCLUDE_DIR)/kernel.mk

          PKG_NAME:=tutuicmptunnel-bpf
          PKG_VERSION:=1.7
          PKG_RELEASE:=1

          PKG_SOURCE:=tutuicmptunnel-bpf-src.tar.gz
          PKG
