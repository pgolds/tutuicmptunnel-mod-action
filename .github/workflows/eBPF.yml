name: Build tutuicmptunnel (eBPF Multi-Version)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      distro:
        description: '固件发行版 (OpenWrt / ImmortalWrt)'
        required: true
        type: choice
        default: 'immortalwrt'
        options:
          - immortalwrt
          - openwrt
      version:
        description: '固件版本号 (如: 25.12.0, 24.10.1, 24.10.0 或 SNAPSHOT)'
        required: true
        type: string
        default: '25.12.0'
      target:
        description: '目标架构 (选 custom 时读取下方自定义架构)'
        required: true
        type: choice
        default: 'qualcommax/ipq807x'
        options:
          - qualcommax/ipq807x
          - qualcommax/ipq60xx
          - mediatek/filogic
          - mediatek/mt7622
          - rockchip/armv8
          - x86/64
          - ramips/mt7621
          - custom
      custom_target:
        description: '自定义 Target/Subtarget (仅当上方选 custom 时生效，如 bcm27xx/bcm2711)'
        required: false
        type: string
        default: ''
      src_ref:
        description: 'tutuicmptunnel 源码分支或 Tag (留空拉取默认分支)'
        required: false
        type: string
        default: ''
      enable_xdp:
        description: '开启 XDP Ingress 极致性能模式 (tcpdump 将只能看到还原后的 UDP)'
        required: false
        type: boolean
        default: false
      upload_release:
        description: '自动上传到 GitHub Release'
        required: false
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve build parameters & SDK URL
        id: meta
        run: |
          DISTRO="${{ github.event.inputs.distro }}"
          VERSION="${{ github.event.inputs.version }}"
          TARGET="${{ github.event.inputs.target }}"

          [ -z "$DISTRO" ] && DISTRO="immortalwrt"
          [ -z "$VERSION" ] && VERSION="25.12.0"
          [ -z "$TARGET" ] && TARGET="qualcommax/ipq807x"

          if [ "$TARGET" = "custom" ]; then
            TARGET="${{ github.event.inputs.custom_target }}"
          fi

          case "$TARGET" in
            */*) ;;
            *)
              echo "❌ 错误: Target 格式必须为 <target>/<subtarget>，例如 x86/64 或 bcm27xx/bcm2711"
              exit 1
              ;;
          esac

          if [ "$DISTRO" = "immortalwrt" ]; then
            BASE_HOST="https://downloads.immortalwrt.org"
          else
            BASE_HOST="https://downloads.openwrt.org"
          fi

          if [ "$VERSION" = "SNAPSHOT" ] || [ "$VERSION" = "snapshot" ]; then
            SDK_BASE_URL="${BASE_HOST}/snapshots/targets/${TARGET}/"
            VER_TAG="snapshot"
          else
            SDK_BASE_URL="${BASE_HOST}/releases/${VERSION}/targets/${TARGET}/"
            VER_TAG="${VERSION}"
          fi

          echo "正在查询 SDK 目录: ${SDK_BASE_URL}"
          SDK_FILE=$(curl -fsSLg "$SDK_BASE_URL" | sed -n "s/.*href=\"\(${DISTRO}-sdk-[^\"]*Linux-x86_64\.tar\.[xzst]*\)\".*/\1/p" | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "❌ 未能在 ${SDK_BASE_URL} 找到匹配的 SDK 文件，请核对版本号与架构拼写！"
            exit 1
          fi

          SAFE_TARGET=$(echo "$TARGET" | tr '/' '-')
          RELEASE_TAG="${DISTRO}-${VER_TAG}-${SAFE_TARGET}-tutuicmptunnel-bpf"

          echo "sdk_url=${SDK_BASE_URL}${SDK_FILE}" >> $GITHUB_OUTPUT
          echo "sdk_file=${SDK_FILE}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          echo "✅ 匹配到 SDK: ${SDK_FILE}"
          echo "✅ Release Tag: ${RELEASE_TAG}"

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) \
            zstd clang llvm libelf-dev pkg-config > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Download and extract SDK
        working-directory: /workdir
        run: |
          df -hT $PWD
          wget -q "${{ steps.meta.outputs.sdk_url }}" -O "${{ steps.meta.outputs.sdk_file }}"

          case "${{ steps.meta.outputs.sdk_file }}" in
            *.tar.zst)
              tar --zstd -xf "${{ steps.meta.outputs.sdk_file }}"
              ;;
            *)
              tar -xf "${{ steps.meta.outputs.sdk_file }}"
              ;;
          esac

          rm -f "${{ steps.meta.outputs.sdk_file }}"
          for d in */; do
            mv "$d" openwrt
            break
          done

      - name: Prepare tutuicmptunnel (BPF) OpenWrt Package
        run: |
          cd /workdir/openwrt

          SRC_REF="${{ github.event.inputs.src_ref }}"
          if [ -n "$SRC_REF" ]; then
            git clone --recursive --depth 1 -b "$SRC_REF" https://github.com/hrimfaxi/tutuicmptunnel.git /workdir/tutu-src
          else
            git clone --recursive --depth 1 https://github.com/hrimfaxi/tutuicmptunnel.git /workdir/tutu-src
          fi

          mkdir -p dl package/tutuicmptunnel-bpf
          tar -czf dl/tutuicmptunnel-bpf-src.tar.gz -C /workdir tutu-src

          XDP_FLAG="0"
          if [ "${{ github.event.inputs.enable_xdp }}" = "true" ]; then
            XDP_FLAG="1"
          fi

          cat << 'EOF' > package/tutuicmptunnel-bpf/Makefile
          include $(TOPDIR)/rules.mk
          include $(INCLUDE_DIR)/kernel.mk

          PKG_NAME:=tutuicmptunnel-bpf
          PKG_VERSION:=1.7
          PKG_RELEASE:=1

          PKG_SOURCE:=tutuicmptunnel-bpf-src.tar.gz
          PKG_BUILD_DIR:=$(BUILD_DIR)/tutu-src
          PKG_LICENSE:=GPL-2.0-or-later

          CMAKE_GENERATOR:=Unix Makefiles

          include $(INCLUDE_DIR)/package.mk
          include $(INCLUDE_DIR)/cmake.mk

          CMAKE_OPTIONS += \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_HARDEN_MODE=1 \
            -DUSE_SYSTEM_LIBBPF_BPFTOOL=0 \
            -DENABLE_XDP_INGRESS=__XDP_FLAG__

          define Build/Configure
          	(cd $(PKG_BUILD_DIR); \
          		$(CMAKE_VARS) \
          		cmake \
          			-G "Unix Makefiles" \
          			-DCMAKE_TOOLCHAIN_FILE=$(TOOLCHAIN_DIR)/toolchain.cmake \
          			-DCMAKE_INSTALL_PREFIX=/usr \
          			$(CMAKE_OPTIONS) \
          			. \
          	)
          endef

          define Package/tutuicmptunnel-bpf
            SECTION:=net
            CATEGORY:=Network
            TITLE:=eBPF-based UDP-to-ICMP protocol morpher
            DEPENDS:=+libelf +zlib +kmod-tutu-csum-fixup
          endef

          define KernelPackage/tutu-csum-fixup
            SUBMENU:=Network Support
            TITLE:=Checksum fixup kernel module for tutuicmptunnel eBPF
            FILES:=$(PKG_BUILD_DIR)/tutu_csum_fixup/tutu_csum_fixup.ko
            AUTOLOAD:=$(call AutoProbe,tutu_csum_fixup)
          endef

          define Build/Compile
          	$(MAKE) -C $(PKG_BUILD_DIR)
          	if [ -d "$(PKG_BUILD_DIR)/tutu_csum_fixup" ]; then \
          		$(KERNEL_MAKE) M="$(PKG_BUILD_DIR)/tutu_csum_fixup" modules; \
          	fi
          endef

          define Package/tutuicmptunnel-bpf/install
          	$(INSTALL_DIR) $(1)/usr/bin
          	find $(PKG_BUILD_DIR) -maxdepth 2 -type f -executable \( -name "tuctl*" -o -name "tuserver*" \) -exec $(INSTALL_BIN) {} $(1)/usr/bin/ \;
          endef

          $(eval $(call BuildPackage,tutuicmptunnel-bpf))
          $(eval $(call KernelPackage,tutu-csum-fixup))
          EOF

          sed -i 's/^          //' package/tutuicmptunnel-bpf/Makefile
          sed -i "s/__XDP_FLAG__/${XDP_FLAG}/g" package/tutuicmptunnel-bpf/Makefile

          ./scripts/feeds update base packages
          ./scripts/feeds install libelf zlib

          make defconfig
          sed -i 's/^CONFIG_ALL_KMODS=y/# CONFIG_ALL_KMODS is not set/' .config
          sed -i 's/^# \(CONFIG_PACKAGE_.*tutu.*\) is not set/\1=m/' .config
          make defconfig

          echo "=== 已选中的 tutuicmptunnel-bpf 配置项 ==="
          grep -i "tutu" .config || true

      - name: Compile tutuicmptunnel-bpf
        run: |
          cd /workdir/openwrt

          make package/tutuicmptunnel-bpf/clean V=s
          if ! KCFLAGS="-std=gnu11 -Wno-declaration-after-statement" \
            make package/tutuicmptunnel-bpf/compile -j1 V=s > /workdir/build.log 2>&1; then
            echo "❌ 编译失败，以下为最后 80 行真实错误日志："
            tail -n 80 /workdir/build.log
            exit 1
          fi

          mkdir -p /workdir/release_files /workdir/pkg_extract
          find bin/ -type f \( -name "*tutu*.ipk" -o -name "*tutu*.apk" \) -exec cp -v {} /workdir/release_files/ \;

          APK_BIN=$(find /workdir/openwrt/staging_dir/host/ -name "apk" -type f -executable 2>/dev/null | head -n 1)
          if [ -n "$APK_BIN" ] && ls /workdir/release_files/*.apk >/dev/null 2>&1; then
            cd /workdir/pkg_extract
            for f in /workdir/release_files/*.apk; do
              "$APK_BIN" extract --allow-untrusted "$f"
            done
          fi

          if ls /workdir/release_files/*.ipk >/dev/null 2>&1; then
            cd /workdir/pkg_extract
            for f in /workdir/release_files/*.ipk; do
              mkdir -p tmp_ipk
              tar -xzf "$f" -C tmp_ipk
              tar -xzf tmp_ipk/data.tar.gz -C /workdir/pkg_extract
              rm -rf tmp_ipk
            done
          fi

          find /workdir/pkg_extract -name "*.ko" -exec cp -v {} /workdir/release_files/ \;
          find /workdir/pkg_extract -path "*/usr/bin/*" -type f -exec cp -v {} /workdir/release_files/ \;
          find /workdir/pkg_extract -path "*/usr/sbin/*" -type f -exec cp -v {} /workdir/release_files/ \;

          echo "=== 最终输出文件列表 ==="
          ls -lh /workdir/release_files/

      - name: Check output files
        id: tag
        run: |
          if [ -n "$(ls -A /workdir/release_files 2>/dev/null)" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到编译产物 (.ipk / .apk)!"
            exit 1
          fi

      - name: Upload Package to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && github.event.inputs.upload_release != false && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          body: |
            - **Mode**: `eBPF` (XDP Ingress: `${{ github.event.inputs.enable_xdp || false }}`)
            - **Distro**: `${{ github.event.inputs.distro || 'immortalwrt' }}`
            - **Version**: `${{ github.event.inputs.version || '25.12.0' }}`
            - **Target**: `${{ github.event.inputs.target == 'custom' && github.event.inputs.custom_target || (github.event.inputs.target || 'qualcommax/ipq807x') }}`
            - **SDK**: `${{ steps.meta.outputs.sdk_file }}`
          files: /workdir/release_files/*
