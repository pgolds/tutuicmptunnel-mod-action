name: Build tutuicmptunnel-kmod (iStoreOS Native Branch)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      istoreos_branch:
        description: 'iStoreOS 源码分支 (25.12.x 固件填 istoreos-25.12)'
        required: true
        type: string
        default: 'istoreos-25.12'
      target:
        description: '目标平台 (斐讯 N1 填 amlogic/meson)'
        required: true
        type: string
        default: 'amlogic/meson'
      device_profile:
        description: '设备 Profile (斐讯 N1 填 phicomm_n1；不确定可留空)'
        required: false
        type: string
        default: 'phicomm_n1'
      pkg_ref:
        description: 'openwrt-tutuicmptunnel-kmod 分支或 Tag'
        required: false
        type: string
        default: ''
      upload_release:
        description: '自动上传到 GitHub Release'
        required: false
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve build metadata
        id: meta
        run: |
          BRANCH="${{ github.event.inputs.istoreos_branch || 'istoreos-25.12' }}"
          TARGET="${{ github.event.inputs.target || 'amlogic/meson' }}"
          SAFE_TARGET="${TARGET//\//-}"
          RELEASE_TAG="${BRANCH}-${SAFE_TARGET}-tutuicmptunnel-kmod"

          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "target=${TARGET}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "✅ 分支: ${BRANCH}, 目标: ${TARGET}, Release Tag: ${RELEASE_TAG}"

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y $(curl -fsSL https://githubusercontent.com) zstd > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone iStoreOS source & update feeds
        working-directory: /workdir
        run: |
          git clone --depth 1 -b "${{ steps.meta.outputs.branch }}" https://github.com openwrt
          cd /workdir/openwrt

          # 克隆 tutuicmptunnel 模块源码
          PKG_REF="${{ github.event.inputs.pkg_ref }}"
          if [ -n "$PKG_REF" ]; then
            git clone --depth 1 -b "$PKG_REF" https://github.com package/tutuicmptunnel
          else
            git clone --depth 1 https://github.com package/tutuicmptunnel
          fi

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target & build kernel environment
        run: |
          cd /workdir/openwrt
          TARGET="${{ steps.meta.outputs.target }}"
          TARGET_MAIN="${TARGET%/*}"
          TARGET_SUB="${TARGET#*/}"
          PROFILE="${{ github.event.inputs.device_profile }}"

          cat <<EOF > .config
          CONFIG_TARGET_${TARGET_MAIN}=y
          CONFIG_TARGET_${TARGET_MAIN}_${TARGET_SUB}=y
          EOF

          if [ -n "$PROFILE" ]; then
            echo "CONFIG_TARGET_${TARGET_MAIN}_${TARGET_SUB}_DEVICE_${PROFILE}=y" >> .config
          fi

          # 启用 tutuicmptunnel 相关包
          make defconfig
          sed -i 's/^# \(CONFIG_PACKAGE_.*tutu.*\) is not set/\1=m/' .config
          make defconfig

          echo "=== 已选中的目标与 tutuicmptunnel 配置 ==="
          grep -E "CONFIG_TARGET_${TARGET_MAIN}|tutu" .config || true

          echo "=== 编译工具链与目标内核 (生成与 N1 完全一致的内核符号表) ==="
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/linux/compile -j$(nproc)

      - name: Compile tutuicmptunnel
        run: |
          cd /workdir/openwrt

          make package/tutuicmptunnel/clean V=s
          KCFLAGS="-std=gnu11 -Wno-declaration-after-statement" \
            make package/tutuicmptunnel/compile V=s

          mkdir -p /workdir/release_files /workdir/pkg_extract
          find bin/ -type f \( -name "*tutu*.ipk" -o -name "*tutu*.apk" \) -exec cp -v {} /workdir/release_files/ \;

          APK_BIN=$(find /workdir/openwrt/staging_dir/host/ -name "apk" -type f -executable 2>/dev/null | head -n 1)
          if [ -n "$APK_BIN" ] && ls /workdir/release_files/*.apk >/dev/null 2>&1; then
            cd /workdir/pkg_extract
            for f in /workdir/release_files/*.apk; do
              "$APK_BIN" extract --allow-untrusted "$f"
            done
          fi

          if ls /workdir/release_files/*.ipk >/dev/null 2>&1; then
            cd /workdir/pkg_extract
            for f in /workdir/release_files/*.ipk; do
              mkdir -p tmp_ipk
              tar -xzf "$f" -C tmp_ipk
              tar -xzf tmp_ipk/data.tar.gz -C /workdir/pkg_extract
              rm -rf tmp_ipk
            done
          fi

          find /workdir/pkg_extract -name "*.ko" -exec cp -v {} /workdir/release_files/ \;
          find /workdir/pkg_extract -path "*/usr/bin/*" -type f -exec cp -v {} /workdir/release_files/ \;
          find /workdir/pkg_extract -path "*/usr/sbin/*" -type f -exec cp -v {} /workdir/release_files/ \;

          echo "=== 校验生成产物信息 ==="
          ls -lh /workdir/release_files/
          for ko in /workdir/release_files/*.ko; do
            [ -f "$ko" ] && modinfo "$ko" | grep -E "filename|vermagic"
          done

      - name: Check output files
        id: tag
        run: |
          if [ -n "$(ls -A /workdir/release_files 2>/dev/null)" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到编译产物 (.ipk / .apk)!"
            exit 1
          fi

      - name: Upload Package to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && github.event.inputs.upload_release != false && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          body: |
            - **iStoreOS Branch**: `${{ steps.meta.outputs.branch }}`
            - **Target**: `${{ steps.meta.outputs.target }}`
            - **Device Profile**: `${{ github.event.inputs.device_profile || 'Generic' }}`
          files: /workdir/release_files/*
